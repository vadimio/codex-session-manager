[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
[project]
name = "codex-session-manager"
version = "2.1.0"
requires-python = ">=3.11"
dependencies = ["textual==8.2.8"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false
